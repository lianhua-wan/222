<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历表格</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .resume-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border-radius: 5px;
        }
        caption {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            text-align: center;
            padding: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
            width: 15%;
            text-align: right;
            font-weight: normal;
        }
        td {
            width: 35%;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input[type="checkbox"], input[type="radio"] {
            width: auto;
            margin-right: 5px;
        }
        textarea {
            height: 80px;
            resize: vertical;
        }
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
        }
        fieldset {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
        }
        legend {
            font-weight: bold;
            color: #555;
            padding: 0 10px;
            font-size: 16px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            padding: 10px 25px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button[type="reset"] {
            background-color: #f44336;
        }
        button:hover {
            opacity: 0.9;
        }
        .photo-upload {
            display: flex;
            align-items: center;
        }
        .photo-upload input {
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="resume-container">
        <form>
            <table>
                <caption>个人简历</caption>
                <tr>
                    <th>姓名</th>
                    <td><input type="text" name="name" maxlength="20" required></td>
                    <th>性别</th>
                    <td>
                        <select name="gender" required>
                            <option value="">请选择</option>
                            <option value="男">男</option>
                            <option value="女">女</option>
                            <option value="其他">其他</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>年龄</th>
                    <td><input type="number" name="age" min="18" max="60" required></td>
                    <th>籍贯</th>
                    <td><input type="text" name="hometown" maxlength="50"></td>
                </tr>
                <tr>
                    <th>联系电话</th>
                    <td><input type="tel" name="phone" pattern="[0-9]{11}" placeholder="11位手机号码" required></td>
                    <th>电子邮箱</th>
                    <td><input type="email" name="email" required></td>
                </tr>
                <tr>
                    <th>照片</th>
                    <td colspan="3"><input type="file" name="photo" accept="image/*"></td>
                </tr>
                <tr>
                    <th>学历</th>
                    <td>
                        <select name="education" required>
                            <option value="">请选择</option>
                            <option value="高中">高中</option>
                            <option value="大专">大专</option>
                            <option value="本科">本科</option>
                            <option value="硕士">硕士</option>
                            <option value="博士">博士</option>
                        </select>
                    </td>
                    <th>健康状况</th>
                    <td>
                        <select name="health" required>
                            <option value="">请选择</option>
                            <option value="良好">良好</option>
                            <option value="一般">一般</option>
                            <option value="有慢性病">有慢性病</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>婚姻状况</th>
                    <td>
                        <select name="marital_status" required>
                            <option value="">请选择</option>
                            <option value="未婚">未婚</option>
                            <option value="已婚">已婚</option>
                            <option value="离异">离异</option>
                            <option value="丧偶">丧偶</option>
                        </select>
                    </td>
                    <th>求职意向</th>
                    <td>
                        <select name="job_intention" required>
                            <option value="">请选择</option>
                            <option value="前端开发">前端开发</option>
                            <option value="后端开发">后端开发</option>
                            <option value="UI设计">UI设计</option>
                            <option value="产品经理">产品经理</option>
                            <option value="市场营销">市场营销</option>
							<option value="其他职业">其他职业</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>专业</th>
                    <td>
                        <select name="major" required>
                            <option value="">请选择</option>
                            <option value="计算机科学与技术">计算机科学与技术</option>
                            <option value="软件工程">软件工程</option>
                            <option value="电子信息工程">电子信息工程</option>
                            <option value="工商管理">工商管理</option>
                            <option value="通信工程">通信工程</option>
							<option value="其他专业">其他专业</option>
                        </select>
                    </td>
                    <th>毕业院校</th>
                    <td>
                        <select name="school" required>
                            <option value="">请选择</option>
                            <option value="山东大学">山东大学</option>
                            <option value="中国海洋大学">中国海洋大学</option>
                            <option value="青岛大学">青岛大学</option>
                            <option value="鲁东大学">鲁东大学</option>
                            <option value="烟台大学">烟台大学</option>
                            <option value="其他院校">其他院校</option>
                        </select>
                    </td>
                </tr>
            </table>

            <fieldset>
                <legend>技能证书</legend>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="cert1" name="certificates" value="软件测评师">
                        <label for="cert1">软件测评师</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="cert2" name="certificates" value="网站开发工程师">
                        <label for="cert2">网站开发工程师</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="cert3" name="certificates" value="计算机程序设计员">
                        <label for="cert3">计算机程序设计员</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="cert4" name="certificates" value="Python技术开发">
                        <label for="cert4">Python技术开发</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="cert5" name="certificates" value="网络信息安全工程师">
                        <label for="cert5">网络信息安全工程师</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="cert6" name="certificates" value="其他">
                        <label for="cert6">其他</label>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>个人特长与爱好</legend>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="hobby1" name="hobbies" value="音乐">
                        <label for="hobby1">音乐</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="hobby2" name="hobbies" value="体育">
                        <label for="hobby2">体育</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="hobby3" name="hobbies" value="阅读">
                        <label for="hobby3">阅读</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="hobby4" name="hobbies" value="旅游">
                        <label for="hobby4">旅游</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="hobby5" name="hobbies" value="摄影">
                        <label for="hobby5">摄影</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="hobby6" name="hobbies" value="其他">
                        <label for="hobby6">其他</label>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>项目经历</legend>
                <textarea name="project_experience" maxlength="500" placeholder="请简要描述您的项目经历..."></textarea>
            </fieldset>

            <fieldset>
                <legend>自我评价</legend>
                <textarea name="self_evaluation" maxlength="500" placeholder="请简要描述您的自我评价..."></textarea>
            </fieldset>

            <div class="buttons">
                <button type="submit">提交</button>
                <button type="reset">重置</button>
            </div>
        </form>
    </div>
</body>
</html>
